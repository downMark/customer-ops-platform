AWSTemplateFormatVersion: "2010-09-09"
Description: Customer Ops shared AWS foundation resources.

Parameters:
  Environment:
    Type: String
    AllowedValues: [staging, production]
  DatabaseUrl:
    Type: String
    NoEcho: true
    MinLength: 1
  FrontendOrigin:
    Type: String
    Default: https://placeholder.invalid
    MinLength: 1
  ModelBucketName:
    Type: String
    Default: customer-ops-models
  ModelObjectKey:
    Type: String
    Default: models/customer-ops/customer-ops-q4_k_m.gguf
  EmbeddingModelPrefix:
    Type: String
    Default: models/customer-ops/bge-m3-onnx/
    AllowedPattern: "^models/customer-ops/[A-Za-z0-9._/-]+/$"
  RerankModelPrefix:
    Type: String
    Default: models/customer-ops/bge-reranker-v2-m3-onnx/
    AllowedPattern: "^models/customer-ops/[A-Za-z0-9._/-]+/$"
  GpuInstanceType:
    Type: String
    Default: g4dn.xlarge
    AllowedValues: [g4dn.xlarge]
  GpuRootVolumeSize:
    Type: Number
    Default: 50
    MinValue: 40
    MaxValue: 200
  LatestEcsGpuOptimizedAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ecs/optimized-ami/amazon-linux-2023/gpu/recommended/image_id
  VpcCidr:
    Type: String
    Default: 10.42.0.0/16
  PublicSubnet1Cidr:
    Type: String
    Default: 10.42.0.0/24
  PublicSubnet2Cidr:
    Type: String
    Default: 10.42.1.0/24
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub customer-ops-${Environment}

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub customer-ops-${Environment}

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub customer-ops-${Environment}-public

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Ref PublicSubnet1Cidr
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub customer-ops-${Environment}-public-a

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Ref PublicSubnet2Cidr
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub customer-ops-${Environment}-public-b

  PublicSubnet1RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PublicAlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public model API ALB
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub customer-ops-${Environment}-alb

  ModelApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Model API Fargate tasks
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 4111
          ToPort: 4111
          SourceSecurityGroupId: !Ref PublicAlbSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub customer-ops-${Environment}-model-api

  ModelServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private model-server tasks and GPU container instances
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref ModelApiSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub customer-ops-${Environment}-model-server

  PerformanceCleanerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Outbound-only performance cleaner tasks
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub customer-ops-${Environment}-performance-cleaner

  ModelServerSubnet1Ingress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ModelServerSecurityGroup
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
      CidrIp: !Ref PublicSubnet1Cidr
      Description: Internal NLB health checks and model API traffic from subnet 1

  ModelServerSubnet2Ingress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ModelServerSecurityGroup
      IpProtocol: tcp
      FromPort: 8000
      ToPort: 8000
      CidrIp: !Ref PublicSubnet2Cidr
      Description: Internal NLB health checks and model API traffic from subnet 2

  ModelApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub customer-ops/${Environment}/model-api
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Retain 20 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}

  ModelServerRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub customer-ops/${Environment}/model-server
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Retain 10 model-server images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}

  PerformanceCleanerRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub customer-ops/${Environment}/performance-cleaner
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Retain 20 cleaner images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}

  PerformanceStream:
    Type: AWS::Kinesis::Stream
    Properties:
      Name: !Sub customer-ops-${Environment}-performance
      StreamModeDetails:
        StreamMode: ON_DEMAND
      RetentionPeriodHours: 24
      StreamEncryption:
        EncryptionType: KMS
        KeyId: alias/aws/kinesis

  PerformanceDetailBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub customer-ops-${Environment}-performance-detail-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpirePerformanceDetails
            Status: Enabled
            ExpirationInDays: 30

  PerformanceStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub customer-ops-${Environment}-performance-state
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  PerformanceAggregateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub customer-ops-${Environment}-performance-aggregate
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: environment
          AttributeType: S
        - AttributeName: bucketStart
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: environment-time-index
          KeySchema:
            - AttributeName: environment
              KeyType: HASH
            - AttributeName: bucketStart
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  DeploymentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireLambdaArtifacts
            Status: Enabled
            ExpirationInDays: 30

  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub customer-ops/${Environment}/database-url
      SecretString: !Ref DatabaseUrl

  JwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub customer-ops/${Environment}/jwt-secret
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  ModelApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub customer-ops/${Environment}/model-api-key
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  DomainEventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub customer-ops-${Environment}-domain-events

  OperationsAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub customer-ops-${Environment}-operations-alerts

  FailureDrillTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub customer-ops-${Environment}-failure-drills
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: test_id
          AttributeType: S
      KeySchema:
        - AttributeName: test_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  QualityDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub customer-ops-${Environment}-quality-dlq
      MessageRetentionPeriod: 1209600
      RedriveAllowPolicy:
        redrivePermission: byQueue
        sourceQueueArns:
          - !Sub arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:customer-ops-${Environment}-quality

  AnalyticsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub customer-ops-${Environment}-analytics-dlq
      MessageRetentionPeriod: 1209600
      RedriveAllowPolicy:
        redrivePermission: byQueue
        sourceQueueArns:
          - !Sub arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:customer-ops-${Environment}-analytics

  QualityQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub customer-ops-${Environment}-quality
      VisibilityTimeout: 30
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt QualityDeadLetterQueue.Arn
        maxReceiveCount: 5

  AnalyticsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub customer-ops-${Environment}-analytics
      VisibilityTimeout: 30
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AnalyticsDeadLetterQueue.Arn
        maxReceiveCount: 5

  QualitySubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref DomainEventsTopic
      Protocol: sqs
      Endpoint: !GetAtt QualityQueue.Arn
      RawMessageDelivery: true

  AnalyticsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref DomainEventsTopic
      Protocol: sqs
      Endpoint: !GetAtt AnalyticsQueue.Arn
      RawMessageDelivery: true

  EventQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref QualityQueue
        - !Ref AnalyticsQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource:
              - !GetAtt QualityQueue.Arn
              - !GetAtt AnalyticsQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref DomainEventsTopic

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub customer-ops-${Environment}
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  GpuContainerInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub customer-ops-${Environment}-gpu-container-instance
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy

  GpuContainerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref GpuContainerInstanceRole

  GpuLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub customer-ops-${Environment}-gpu
      LaunchTemplateData:
        ImageId: !Ref LatestEcsGpuOptimizedAmi
        InstanceType: !Ref GpuInstanceType
        IamInstanceProfile:
          Arn: !GetAtt GpuContainerInstanceProfile.Arn
        SecurityGroupIds:
          - !Ref ModelServerSecurityGroup
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 2
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              DeleteOnTermination: true
              Encrypted: true
              VolumeSize: !Ref GpuRootVolumeSize
              VolumeType: gp3
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail
            cat >> /etc/ecs/ecs.config <<'EOF'
            ECS_CLUSTER=${EcsCluster}
            ECS_ENABLE_GPU_SUPPORT=true
            ECS_ENABLE_TASK_IAM_ROLE=true
            ECS_ENABLE_TASK_IAM_ROLE_NETWORK_HOST=true
            EOF

            dnf install -y amazon-cloudwatch-agent
            cat > /opt/aws/amazon-cloudwatch-agent/etc/customer-ops-gpu.json <<'EOF'
            {
              "agent": {
                "metrics_collection_interval": 60
              },
              "metrics": {
                "namespace": "CustomerOps/GPU",
                "append_dimensions": {
                  "InstanceId": "${!aws:InstanceId}"
                },
                "metrics_collected": {
                  "nvidia_gpu": {
                    "measurement": [
                      "utilization_gpu",
                      "utilization_memory",
                      "memory_used",
                      "temperature_gpu"
                    ],
                    "metrics_collection_interval": 60
                  }
                }
              }
            }
            EOF
            /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
              -a fetch-config \
              -m ec2 \
              -s \
              -c file:/opt/aws/amazon-cloudwatch-agent/etc/customer-ops-gpu.json

  GpuAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub customer-ops-${Environment}-gpu
      MinSize: "0"
      DesiredCapacity: "0"
      MaxSize: "1"
      NewInstancesProtectedFromScaleIn: true
      HealthCheckType: EC2
      VPCZoneIdentifier:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      LaunchTemplate:
        LaunchTemplateId: !Ref GpuLaunchTemplate
        Version: !GetAtt GpuLaunchTemplate.LatestVersionNumber
      Tags:
        - Key: Name
          Value: !Sub customer-ops-${Environment}-gpu
          PropagateAtLaunch: true
        - Key: AmazonECSManaged
          Value: "true"
          PropagateAtLaunch: true

  GpuCapacityProvider:
    Type: AWS::ECS::CapacityProvider
    Properties:
      Name: !Sub customer-ops-${Environment}-gpu
      AutoScalingGroupProvider:
        AutoScalingGroupArn: !Ref GpuAutoScalingGroup
        ManagedDraining: ENABLED
        ManagedScaling:
          Status: ENABLED
          TargetCapacity: 100
          MinimumScalingStepSize: 1
          MaximumScalingStepSize: 1
          InstanceWarmupPeriod: 300
        ManagedTerminationProtection: ENABLED
      Tags:
        - Key: Name
          Value: !Sub customer-ops-${Environment}-gpu

  ClusterCapacityProviderAssociations:
    Type: AWS::ECS::ClusterCapacityProviderAssociations
    Properties:
      Cluster: !Ref EcsCluster
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
        - !Ref GpuCapacityProvider
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1

  EcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub customer-ops-${Environment}-task-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadRuntimeSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref ModelApiKeySecret

  ModelServerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub customer-ops-${Environment}-model-server-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadModelArtifact
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${ModelBucketName}/${ModelObjectKey}
                  - !Sub arn:${AWS::Partition}:s3:::${ModelBucketName}/${EmbeddingModelPrefix}*
                  - !Sub arn:${AWS::Partition}:s3:::${ModelBucketName}/${RerankModelPrefix}*
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${ModelBucketName}
                Condition:
                  StringLike:
                    s3:prefix:
                      - !Sub ${EmbeddingModelPrefix}*
                      - !Sub ${RerankModelPrefix}*

  ModelApiTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub customer-ops-${Environment}-model-api-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  PerformanceCleanerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub customer-ops-${Environment}-performance-cleaner-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CleanPerformanceEvents
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - kinesis:DescribeStreamSummary
                  - kinesis:ListShards
                  - kinesis:GetShardIterator
                  - kinesis:GetRecords
                Resource: !GetAtt PerformanceStream.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt PerformanceStateTable.Arn
                  - !GetAtt PerformanceAggregateTable.Arn
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${PerformanceDetailBucket.Arn}/*

  PerformanceLogsToKinesisRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub customer-ops-${Environment}-logs-to-performance
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub logs.${AWS::Region}.${AWS::URLSuffix}
            Action: sts:AssumeRole
            Condition:
              StringLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*
      Policies:
        - PolicyName: WritePerformanceStream
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: kinesis:PutRecord
                Resource: !GetAtt PerformanceStream.Arn

  ModelApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /customer-ops/${Environment}/model-api
      RetentionInDays: 30

  ModelServerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /customer-ops/${Environment}/model-server
      RetentionInDays: 30

  PerformanceCleanerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /customer-ops/${Environment}/performance-cleaner
      RetentionInDays: 30

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/customer-ops-${Environment}-backend
      RetentionInDays: 30

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export:
      Name: !Sub customer-ops-${Environment}-vpc-id
  PublicSubnetIds:
    Value: !Join [",", [!Ref PublicSubnet1, !Ref PublicSubnet2]]
    Export:
      Name: !Sub customer-ops-${Environment}-public-subnets
  PublicAlbSecurityGroupId:
    Value: !Ref PublicAlbSecurityGroup
    Export:
      Name: !Sub customer-ops-${Environment}-alb-sg
  ModelApiSecurityGroupId:
    Value: !Ref ModelApiSecurityGroup
    Export:
      Name: !Sub customer-ops-${Environment}-model-api-sg
  ModelServerSecurityGroupId:
    Value: !Ref ModelServerSecurityGroup
    Export:
      Name: !Sub customer-ops-${Environment}-model-server-sg
  PerformanceCleanerSecurityGroupId:
    Value: !Ref PerformanceCleanerSecurityGroup
    Export:
      Name: !Sub customer-ops-${Environment}-performance-cleaner-sg
  ClusterName:
    Value: !Ref EcsCluster
    Export:
      Name: !Sub customer-ops-${Environment}-cluster
  GpuCapacityProviderName:
    Value: !Ref GpuCapacityProvider
    Export:
      Name: !Sub customer-ops-${Environment}-gpu-capacity-provider
  GpuAutoScalingGroupName:
    Value: !Ref GpuAutoScalingGroup
  ModelApiRepositoryUri:
    Value: !GetAtt ModelApiRepository.RepositoryUri
  ModelApiRepositoryName:
    Value: !Ref ModelApiRepository
  ModelServerRepositoryUri:
    Value: !GetAtt ModelServerRepository.RepositoryUri
  ModelServerRepositoryName:
    Value: !Ref ModelServerRepository
  PerformanceCleanerRepositoryName:
    Value: !Ref PerformanceCleanerRepository
  DeploymentBucketName:
    Value: !Ref DeploymentBucket
  EcsTaskExecutionRoleArn:
    Value: !GetAtt EcsTaskExecutionRole.Arn
    Export:
      Name: !Sub customer-ops-${Environment}-task-execution-role
  ModelServerTaskRoleArn:
    Value: !GetAtt ModelServerTaskRole.Arn
    Export:
      Name: !Sub customer-ops-${Environment}-model-server-task-role
  ModelApiTaskRoleArn:
    Value: !GetAtt ModelApiTaskRole.Arn
    Export:
      Name: !Sub customer-ops-${Environment}-model-api-task-role
  PerformanceCleanerTaskRoleArn:
    Value: !GetAtt PerformanceCleanerTaskRole.Arn
    Export:
      Name: !Sub customer-ops-${Environment}-performance-cleaner-task-role
  PerformanceStreamName:
    Value: !Ref PerformanceStream
    Export:
      Name: !Sub customer-ops-${Environment}-performance-stream-name
  PerformanceStreamArn:
    Value: !GetAtt PerformanceStream.Arn
    Export:
      Name: !Sub customer-ops-${Environment}-performance-stream-arn
  PerformanceLogsRoleArn:
    Value: !GetAtt PerformanceLogsToKinesisRole.Arn
    Export:
      Name: !Sub customer-ops-${Environment}-performance-logs-role
  PerformanceStateTableName:
    Value: !Ref PerformanceStateTable
    Export:
      Name: !Sub customer-ops-${Environment}-performance-state-table
  PerformanceAggregateTableName:
    Value: !Ref PerformanceAggregateTable
    Export:
      Name: !Sub customer-ops-${Environment}-performance-aggregate-table
  PerformanceDetailBucketName:
    Value: !Ref PerformanceDetailBucket
    Export:
      Name: !Sub customer-ops-${Environment}-performance-detail-bucket
  DatabaseSecretArn:
    Value: !Ref DatabaseSecret
    Export:
      Name: !Sub customer-ops-${Environment}-database-secret
  JwtSecretArn:
    Value: !Ref JwtSecret
    Export:
