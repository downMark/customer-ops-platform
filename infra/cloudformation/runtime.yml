AWSTemplateFormatVersion: "2010-09-09"
Description: Customer Ops Lambda, API Gateway, ECS services, and load balancers.

Parameters:
  Environment:
    Type: String
    AllowedValues: [staging, production]
  BackendLambdaCodeBucket:
    Type: String
  BackendLambdaCodeKey:
    Type: String
  EventWorkerLambdaCodeKey:
    Type: String
  ModelApiImageUri:
    Type: String
  ModelServerImageUri:
    Type: String
  ModelBucketName:
    Type: String
    Default: customer-ops-models
  ModelObjectKey:
    Type: String
    Default: models/customer-ops/customer-ops-q4_k_m.gguf
  EmbeddingModelPrefix:
    Type: String
    Default: models/customer-ops/bge-m3-onnx/
    AllowedPattern: "^models/customer-ops/[A-Za-z0-9._/-]+/$"
  RerankModelPrefix:
    Type: String
    Default: models/customer-ops/bge-reranker-v2-m3-onnx/
    AllowedPattern: "^models/customer-ops/[A-Za-z0-9._/-]+/$"
  ModelSha256:
    Type: String
    Default: ""
  ModelServerComputeType:
    Type: String
    Default: GPU_EC2
    AllowedValues: [GPU_EC2, FARGATE]
  ModelServerGpuLayers:
    Type: String
    Default: "0"
    AllowedValues: ["-1", "0"]
  BackendCanaryPercent:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 1

Conditions:
  UseGpuModelServer: !Equals [!Ref ModelServerComputeType, GPU_EC2]
  UseFargateModelServer: !Equals [!Ref ModelServerComputeType, FARGATE]

Resources:
  BackendLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub customer-ops-${Environment}-backend-lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: PublishDomainEvents
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                  - sns:GetTopicAttributes
                Resource:
                  Fn::ImportValue: !Sub customer-ops-${Environment}-domain-events-topic
        - PolicyName: OperationsStatusAndDrills
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:GetQueueAttributes
                  - sqs:StartMessageMoveTask
                  - sqs:ListMessageMoveTasks
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:SendMessage
                Resource:
                  - Fn::ImportValue: !Sub customer-ops-${Environment}-quality-queue-arn
                  - Fn::ImportValue: !Sub customer-ops-${Environment}-analytics-queue-arn
                  - Fn::ImportValue: !Sub customer-ops-${Environment}-quality-dlq-arn
                  - Fn::ImportValue: !Sub customer-ops-${Environment}-analytics-dlq-arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource:
                  Fn::ImportValue: !Sub customer-ops-${Environment}-failure-drills-table-arn
              - Effect: Allow
                Action:
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:GetMetricStatistics
                Resource: "*"

  BackendFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub customer-ops-${Environment}-backend
      Description: Customer Ops authenticated order API
      Runtime: provided.al2023
      Handler: bootstrap
      Architectures: [x86_64]
      MemorySize: 512
      Timeout: 30
      Role: !GetAtt BackendLambdaRole.Arn
      Code:
        S3Bucket: !Ref BackendLambdaCodeBucket
        S3Key: !Ref BackendLambdaCodeKey
      Environment:
        Variables:
          DATABASE_URL:
            Fn::Sub:
              - "{{resolve:secretsmanager:${SecretArn}:SecretString}}"
              - SecretArn:
                  Fn::ImportValue: !Sub customer-ops-${Environment}-database-secret
          AUTH_JWT_SECRET:
            Fn::Sub:
              - "{{resolve:secretsmanager:${SecretArn}:SecretString}}"
              - SecretArn:
                  Fn::ImportValue: !Sub customer-ops-${Environment}-jwt-secret
          AUTH_JWT_TTL_SECONDS: "86400"
          DB_MAX_CONNECTIONS: "2"
          AWS_LAMBDA_HTTP_IGNORE_STAGE_IN_PATH: "true"
          CORS_ORIGINS:
            Fn::ImportValue: !Sub customer-ops-${Environment}-frontend-origin
          SNS_TOPIC_ARN:
            Fn::ImportValue: !Sub customer-ops-${Environment}-domain-events-topic
          OPERATIONS_TABLE_NAME:
            Fn::ImportValue: !Sub customer-ops-${Environment}-failure-drills-table
          QUALITY_QUEUE_URL:
            Fn::ImportValue: !Sub customer-ops-${Environment}-quality-queue-url
          ANALYTICS_QUEUE_URL:
            Fn::ImportValue: !Sub customer-ops-${Environment}-analytics-queue-url
          QUALITY_DLQ_URL:
            Fn::ImportValue: !Sub customer-ops-${Environment}-quality-dlq-url
          ANALYTICS_DLQ_URL:
            Fn::ImportValue: !Sub customer-ops-${Environment}-analytics-dlq-url
          OPERATIONS_ALARM_NAMES: !Sub >-
            customer-ops-${Environment}-quality-dlq,
            customer-ops-${Environment}-analytics-dlq,
            customer-ops-${Environment}-api-health-canary,
            customer-ops-${Environment}-backend-canary-errors,
            customer-ops-${Environment}-backend-api-5xx
          RUST_LOG: info,customer_ops_backend=info

  EventWorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/customer-ops-${Environment}-event-worker
      RetentionInDays: 30

  EventWorkerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub customer-ops-${Environment}-event-worker
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ConsumeDomainEventQueues
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource:
                  - Fn::ImportValue: !Sub customer-ops-${Environment}-quality-queue-arn
                  - Fn::ImportValue: !Sub customer-ops-${Environment}-analytics-queue-arn
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource:
                  Fn::ImportValue: !Sub customer-ops-${Environment}-failure-drills-table-arn

  EventWorkerFunction:
    Type: AWS::Lambda::Function
    DependsOn: EventWorkerLogGroup
    Properties:
      FunctionName: !Sub customer-ops-${Environment}-event-worker
      Description: Consumes quality and analytics domain events, including controlled DLQ drills
      Runtime: provided.al2023
      Handler: bootstrap
      Architectures: [x86_64]
      MemorySize: 256
      Timeout: 5
      Role: !GetAtt EventWorkerRole.Arn
      Code:
        S3Bucket: !Ref BackendLambdaCodeBucket
        S3Key: !Ref EventWorkerLambdaCodeKey
      Environment:
        Variables:
          OPERATIONS_TABLE_NAME:
            Fn::ImportValue: !Sub customer-ops-${Environment}-failure-drills-table
          RUST_LOG: info,customer_ops_event_worker=info

  QualityQueueEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref EventWorkerFunction
      EventSourceArn:
        Fn::ImportValue: !Sub customer-ops-${Environment}-quality-queue-arn
      BatchSize: 1
      Enabled: true
      FunctionResponseTypes: [ReportBatchItemFailures]

  AnalyticsQueueEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref EventWorkerFunction
      EventSourceArn:
        Fn::ImportValue: !Sub customer-ops-${Environment}-analytics-queue-arn
      BatchSize: 1
      Enabled: true
      FunctionResponseTypes: [ReportBatchItemFailures]

  BackendInitialVersion:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref BackendFunction
      Description: !Sub Initial ${Environment} version from ${BackendLambdaCodeKey}

  BackendStableAlias:
    Type: AWS::Lambda::Alias
    Properties:
      Name: stable
      Description: Stable backend version receiving normal API traffic
      FunctionName: !Ref BackendFunction
      FunctionVersion: !GetAtt BackendInitialVersion.Version

  BackendCanaryAlias:
    Type: AWS::Lambda::Alias
    Properties:
      Name: canary
      Description: Candidate backend version receiving API Gateway canary traffic
      FunctionName: !Ref BackendFunction
      FunctionVersion: !GetAtt BackendInitialVersion.Version

  BackendRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub customer-ops-${Environment}-backend
      EndpointConfiguration:
        Types: [REGIONAL]

  BackendRootMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref BackendRestApi
      ResourceId: !GetAtt BackendRestApi.RootResourceId
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BackendFunction.Arn}:${!stageVariables.lambdaAlias}/invocations

  BackendProxyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref BackendRestApi
      ParentId: !GetAtt BackendRestApi.RootResourceId
      PathPart: "{proxy+}"

  BackendProxyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref BackendRestApi
      ResourceId: !Ref BackendProxyResource
      HttpMethod: ANY
      AuthorizationType: NONE
      RequestParameters:
        method.request.path.proxy: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BackendFunction.Arn}:${!stageVariables.lambdaAlias}/invocations
        RequestParameters:
          integration.request.path.proxy: method.request.path.proxy

  BackendApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - BackendRootMethod
      - BackendProxyMethod
    Properties:
      RestApiId: !Ref BackendRestApi

  BackendApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref BackendRestApi
      DeploymentId: !Ref BackendApiDeployment
      StageName: !Ref Environment
      TracingEnabled: true
      Variables:
        lambdaAlias: stable
      CanarySetting:
        PercentTraffic: !Ref BackendCanaryPercent
        UseStageCache: false
        StageVariableOverrides:
          lambdaAlias: canary
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          MetricsEnabled: true

  BackendStableInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BackendStableAlias
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${BackendRestApi}/*

  BackendCanaryInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref BackendCanaryAlias
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${BackendRestApi}/*

  BackendCanaryErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub customer-ops-${Environment}-backend-canary-errors
      AlarmDescription: Roll back the backend canary when the candidate Lambda errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref BackendFunction
        - Name: Resource
          Value: !Sub ${BackendFunction}:canary
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub customer-ops-${Environment}-operations-alerts-topic

  BackendApi5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub customer-ops-${Environment}-backend-api-5xx
      AlarmDescription: Roll back the backend canary when API Gateway returns 5XX responses.
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub customer-ops-${Environment}-backend
        - Name: Stage
          Value: !Ref Environment
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub customer-ops-${Environment}-operations-alerts-topic

  QualityDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub customer-ops-${Environment}-quality-dlq
      AlarmDescription: Quality dead-letter queue contains one or more messages.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !Sub customer-ops-${Environment}-quality-dlq
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub customer-ops-${Environment}-operations-alerts-topic

  AnalyticsDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub customer-ops-${Environment}-analytics-dlq
      AlarmDescription: Analytics dead-letter queue contains one or more messages.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !Sub customer-ops-${Environment}-analytics-dlq
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub customer-ops-${Environment}-operations-alerts-topic

  SyntheticsCanaryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub customer-ops-${Environment}-synthetics-api-health
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RunApiHealthCanary
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetBucketLocation
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${BackendLambdaCodeBucket}
                  - !Sub arn:${AWS::Partition}:s3:::${BackendLambdaCodeBucket}/synthetics/${Environment}/*
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - cloudwatch:PutMetricData
                  - xray:PutTraceSegments
                Resource: "*"

  ApiHealthCanary:
    Type: AWS::Synthetics::Canary
    Properties:
      Name: !Sub cops-${Environment}-api
      ArtifactS3Location: !Sub s3://${BackendLambdaCodeBucket}/synthetics/${Environment}/
      ExecutionRoleArn: !GetAtt SyntheticsCanaryRole.Arn
      RuntimeVersion: syn-nodejs-puppeteer-17.0
      StartCanaryAfterCreation: true
      SuccessRetentionPeriod: 31
      FailureRetentionPeriod: 31
      Schedule:
        Expression: rate(5 minutes)
        DurationInSeconds: "0"
      RunConfig:
        TimeoutInSeconds: 30
        EnvironmentVariables:
          HEALTH_URL: !Sub https://${BackendRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}/api/health
      Code:
        Handler: index.handler
        Script: |
          const synthetics = require('Synthetics');
          const log = require('SyntheticsLogger');

          exports.handler = async () => {
            const url = process.env.HEALTH_URL;
            await synthetics.executeHttpStep('backend-api-health', {
              hostname: new URL(url).hostname,
              method: 'GET',
              path: new URL(url).pathname,
              port: 443,
              protocol: 'https:'
            }, async (response) => {
              let body = '';
              response.on('data', chunk => { body += chunk; });
              await new Promise((resolve, reject) => {
                response.on('end', resolve);
                response.on('error', reject);
              });
              if (response.statusCode !== 200) {
                throw new Error('Expected HTTP 200, received ' + response.statusCode);
              }
              const parsed = JSON.parse(body);
              if (!parsed.success || !parsed.data || parsed.data.status !== 'ok') {
                log.error('Unexpected health response: ' + body);
                throw new Error('Health response contract failed');
              }
            });
          };

  ApiHealthCanaryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub customer-ops-${Environment}-api-health-canary
      AlarmDescription: Production backend API health canary failed.
      Namespace: CloudWatchSynthetics
      MetricName: SuccessPercent
      Dimensions:
        - Name: CanaryName
          Value: !Ref ApiHealthCanary
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 100
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - Fn::ImportValue: !Sub customer-ops-${Environment}-operations-alerts-topic

  ModelServerLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub cops-${Environment}-model-int
      Scheme: internal
      Type: network
      Subnets:
        Fn::Split:
          - ","
          - Fn::ImportValue: !Sub customer-ops-${Environment}-public-subnets

  ModelServerTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: UseFargateModelServer
    Properties:
      Name: !Sub cops-${Environment}-model
      VpcId:
        Fn::ImportValue: !Sub customer-ops-${Environment}-vpc-id
      Port: 8000
      Protocol: TCP
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health
      HealthCheckPort: "8000"
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      HealthCheckIntervalSeconds: 30

  GpuModelServerTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: UseGpuModelServer
    Properties:
      Name: !Sub cops-${Environment}-model-gpu
      VpcId:
        Fn::ImportValue: !Sub customer-ops-${Environment}-vpc-id
      Port: 8000
      Protocol: TCP
      TargetType: instance
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health
      HealthCheckPort: "8000"
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      HealthCheckIntervalSeconds: 30

  ModelServerListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ModelServerLoadBalancer
      Port: 8000
      Protocol: TCP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !If
            - UseGpuModelServer
            - !Ref GpuModelServerTargetGroup
            - !Ref ModelServerTargetGroup

  ModelServerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub customer-ops-${Environment}-model-server
      RequiresCompatibilities:
        - !If [UseGpuModelServer, EC2, FARGATE]
      NetworkMode: !If [UseGpuModelServer, bridge, awsvpc]
      Cpu: "4096"
      Memory: !If [UseGpuModelServer, "14336", "16384"]
      EphemeralStorage: !If
        - UseGpuModelServer
        - !Ref AWS::NoValue
        - SizeInGiB: 30
      ExecutionRoleArn:
        Fn::ImportValue: !Sub customer-ops-${Environment}-task-execution-role
      TaskRoleArn:
        Fn::ImportValue: !Sub customer-ops-${Environment}-model-server-task-role
      Volumes:
        - Name: model-cache
      ContainerDefinitions:
        - Name: model-server
          Image: !Ref ModelServerImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8000
              HostPort: 8000
              Protocol: tcp
          ResourceRequirements: !If
            - UseGpuModelServer
            - - Type: GPU
                Value: "1"
            - !Ref AWS::NoValue
          MountPoints:
            - SourceVolume: model-cache
              ContainerPath: /models
              ReadOnly: false
          Environment:
            - Name: MODEL_S3_URI
              Value: !Sub s3://${ModelBucketName}/${ModelObjectKey}
            - Name: MODEL_SHA256
              Value: !Ref ModelSha256
            - Name: MODEL_PATH
              Value: /models/customer-ops-q4_k_m.gguf
            - Name: EMBEDDING_MODEL_S3_URI
              Value: !Sub s3://${ModelBucketName}/${EmbeddingModelPrefix}
            - Name: RERANK_MODEL_S3_URI
              Value: !Sub s3://${ModelBucketName}/${RerankModelPrefix}
            - Name: EMBEDDING_MODEL_PATH
              Value: /models/bge-m3-onnx/model.onnx
            - Name: RERANK_MODEL_PATH
              Value: /models/bge-reranker-v2-m3-onnx/model.onnx
            - Name: EMBEDDING_MODEL_ALIAS
              Value: bge-m3
            - Name: RERANK_MODEL_ALIAS
              Value: bge-reranker-v2-m3
            - Name: EMBEDDING_DIM
              Value: "1024"
            - Name: EMBEDDING_MAX_LENGTH
              Value: "1024"
            - Name: RERANK_MAX_LENGTH
              Value: "1024"
            - Name: ONNX_THREADS
              Value: "1"
            - Name: MODEL_ALIAS
              Value: customer-ops
            - Name: MODEL_HOST
              Value: 0.0.0.0
            - Name: MODEL_PORT
              Value: "8000"
            - Name: MODEL_GPU_LAYERS
              Value: !If [UseGpuModelServer, !Ref ModelServerGpuLayers, "0"]
            - Name: MODEL_DISABLE_THINKING
              Value: "true"
            - Name: MODEL_THREADS
              Value: "4"
          Secrets:
            - Name: MODEL_SERVER_API_KEY
              ValueFrom:
                Fn::ImportValue: !Sub customer-ops-${Environment}-model-api-key-secret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-region: !Ref AWS::Region
              awslogs-group:
                Fn::ImportValue: !Sub customer-ops-${Environment}-model-server-log-group
              awslogs-stream-prefix: ecs

  ModelServerService:
    Type: AWS::ECS::Service
    DependsOn: ModelServerListener
    Properties:
      ServiceName: !If
        - UseGpuModelServer
        - !Sub customer-ops-${Environment}-model-server-gpu
        - !Sub customer-ops-${Environment}-model-server
      Cluster:
        Fn::ImportValue: !Sub customer-ops-${Environment}-cluster
      TaskDefinition: !Ref ModelServerTaskDefinition
      DesiredCount: 1
      LaunchType: !If [UseGpuModelServer, !Ref AWS::NoValue, FARGATE]
      PlatformVersion: !If [UseGpuModelServer, !Ref AWS::NoValue, LATEST]
      CapacityProviderStrategy: !If
        - UseGpuModelServer
        - - CapacityProvider:
              Fn::ImportValue: !Sub customer-ops-${Environment}-gpu-capacity-provider
            Base: 1
            Weight: 1
        - !Ref AWS::NoValue
      HealthCheckGracePeriodSeconds: 900
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
      NetworkConfiguration: !If
        - UseGpuModelServer
        - !Ref AWS::NoValue
        - AwsvpcConfiguration:
            AssignPublicIp: ENABLED
            Subnets:
              Fn::Split:
                - ","
                - Fn::ImportValue: !Sub customer-ops-${Environment}-public-subnets
            SecurityGroups:
              - Fn::ImportValue: !Sub customer-ops-${Environment}-model-server-sg
      LoadBalancers:
        - ContainerName: model-server
          ContainerPort: 8000
          TargetGroupArn: !If
            - UseGpuModelServer
            - !Ref GpuModelServerTargetGroup
            - !Ref ModelServerTargetGroup

  ModelApiLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub cops-${Environment}-api
      Scheme: internet-facing
      Type: application
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "300"
      SecurityGroups:
        - Fn::ImportValue: !Sub customer-ops-${Environment}-alb-sg
      Subnets:
        Fn::Split:
          - ","
          - Fn::ImportValue: !Sub customer-ops-${Environment}-public-subnets

  ModelApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub cops-${Environment}-api
      VpcId:
        Fn::ImportValue: !Sub customer-ops-${Environment}-vpc-id
      Port: 4111
      Protocol: HTTP
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /api/health
      HealthCheckPort: traffic-port
      Matcher:
        HttpCode: 200-399
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      HealthCheckIntervalSeconds: 30
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  ModelApiListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ModelApiLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ModelApiTargetGroup

  ModelApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub customer-ops-${Environment}-model-api
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "1024"
      Memory: "2048"
      ExecutionRoleArn:
        Fn::ImportValue: !Sub customer-ops-${Environment}-task-execution-role
      TaskRoleArn:
        Fn::ImportValue: !Sub customer-ops-${Environment}-model-api-task-role
      ContainerDefinitions:
        - Name: model-api
          Image: !Ref ModelApiImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 4111
              Protocol: tcp
          Environment:
            - Name: PORT
              Value: "4111"
            - Name: MODEL_SERVER_BASE_URL
              Value: !Sub http://${ModelServerLoadBalancer.DNSName}:8000/v1
            - Name: MODEL_SERVER_MODEL
              Value: customer-ops
            - Name: EMBEDDING_MODEL
              Value: bge-m3
            - Name: RERANK_MODEL
              Value: bge-reranker-v2-m3
            - Name: BACKEND_BASE_URL
              Value: !Sub https://${BackendRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}
            - Name: CORS_ORIGINS
              Value:
                Fn::ImportValue: !Sub customer-ops-${Environment}-frontend-origin
            - Name: RAG_ENABLED
              Value: "true"
            - Name: RAG_RETRIEVAL_TOP_K
              Value: "20"
            - Name: RAG_RERANK_TOP_K
              Value: "3"
            - Name: RAG_FINAL_TOP_K
              Value: "3"
            - Name: RAG_MIN_RERANK_SCORE
              Value: "0.1"
            - Name: RAG_TIMEOUT_MS
              Value: "8000"
            - Name: RAG_MAX_CONTEXT_CHARS
              Value: "6000"
          Secrets:
            - Name: MODEL_SERVER_API_KEY
              ValueFrom:
                Fn::ImportValue: !Sub customer-ops-${Environment}-model-api-key-secret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-region: !Ref AWS::Region
              awslogs-group:
                Fn::ImportValue: !Sub customer-ops-${Environment}-model-api-log-group
              awslogs-stream-prefix: ecs

  ModelApiService:
    Type: AWS::ECS::Service
    DependsOn:
      - ModelApiListener
      - ModelServerService
    Properties:
      ServiceName: !Sub customer-ops-${Environment}-model-api
      Cluster:
        Fn::ImportValue: !Sub customer-ops-${Environment}-cluster
      TaskDefinition: !Ref ModelApiTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: LATEST
      HealthCheckGracePeriodSeconds: 900
      DeploymentConfiguration:
        MinimumHealthyPercent: 50
        MaximumPercent: 200
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            Fn::Split:
              - ","
              - Fn::ImportValue: !Sub customer-ops-${Environment}-public-subnets
          SecurityGroups:
            - Fn::ImportValue: !Sub customer-ops-${Environment}-model-api-sg
      LoadBalancers:
        - ContainerName: model-api
          ContainerPort: 4111
          TargetGroupArn: !Ref ModelApiTargetGroup

  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub customer-ops-${Environment}-operations
      DashboardBody: !Sub |
        {
          "start": "-PT6H",
          "periodOverride": "inherit",
          "widgets": [
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Synthetics API health",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "metrics": [
                  ["CloudWatchSynthetics", "SuccessPercent", "CanaryName", "${ApiHealthCanary}", {"stat": "Average"}],
                  [".", "Duration", ".", ".", {"stat": "Average", "yAxis": "right"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "API Gateway traffic and errors",
                "region": "${AWS::Region}",
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiName", "customer-ops-${Environment}-backend", "Stage", "${Environment}", {"stat": "Sum"}],
                  [".", "4XXError", ".", ".", ".", ".", {"stat": "Sum"}],
                  [".", "5XXError", ".", ".", ".", ".", {"stat": "Sum"}],
                  [".", "Latency", ".", ".", ".", ".", {"stat": "p95", "yAxis": "right"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Backend stable / canary Lambda",
                "region": "${AWS::Region}",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${BackendFunction}", "Resource", "${BackendFunction}:stable", {"stat": "Sum"}],
                  [".", "Errors", ".", ".", ".", ".", {"stat": "Sum"}],
                  [".", "Duration", ".", ".", ".", ".", {"stat": "p95", "yAxis": "right"}],
                  [".", "Invocations", ".", ".", ".", "${BackendFunction}:canary", {"stat": "Sum"}],
                  [".", "Errors", ".", ".", ".", ".", {"stat": "Sum"}],
                  [".", "Throttles", ".", ".", ".", ".", {"stat": "Sum"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "SNS domain events",
                "region": "${AWS::Region}",
                "metrics": [
                  ["AWS/SNS", "NumberOfMessagesPublished", "TopicName", "customer-ops-${Environment}-domain-events", {"stat": "Sum"}],
                  [".", "NumberOfNotificationsFailed", ".", ".", {"stat": "Sum"}],
                  [".", "NumberOfNotificationsDelivered", ".", ".", {"stat": "Sum"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 12, "width": 24, "height": 7,
              "properties": {
                "title": "SQS main queues and DLQs",
                "region": "${AWS::Region}",
                "metrics": [
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "customer-ops-${Environment}-quality", {"stat": "Maximum"}],
                  [".", ".", ".", "customer-ops-${Environment}-analytics", {"stat": "Maximum"}],
                  [".", ".", ".", "customer-ops-${Environment}-quality-dlq", {"stat": "Maximum"}],
                  [".", ".", ".", "customer-ops-${Environment}-analytics-dlq", {"stat": "Maximum"}],
                  [".", "ApproximateNumberOfMessagesNotVisible", ".", "customer-ops-${Environment}-quality", {"stat": "Maximum"}],
                  [".", ".", ".", "customer-ops-${Environment}-analytics", {"stat": "Maximum"}],
                  [".", "ApproximateAgeOfOldestMessage", ".", "customer-ops-${Environment}-quality-dlq", {"stat": "Maximum", "yAxis": "right"}],
                  [".", ".", ".", "customer-ops-${Environment}-analytics-dlq", {"stat": "Maximum", "yAxis": "right"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 19, "width": 24, "height": 6,
              "properties": {
                "title": "ECS service capacity",
                "region": "${AWS::Region}",
                "metrics": [
                  ["AWS/ECS", "CPUUtilization", "ClusterName", "customer-ops-${Environment}", "ServiceName", "customer-ops-${Environment}-model-api", {"stat": "Average"}],
                  [".", "MemoryUtilization", ".", ".", ".", ".", {"stat": "Average"}],
                  [".", "CPUUtilization", ".", ".", ".", "customer-ops-${Environment}-model-server", {"stat": "Average"}],
                  [".", "MemoryUtilization", ".", ".", ".", ".", {"stat": "Average"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 25, "width": 24, "height": 6,
              "properties": {
                "title": "Model server NVIDIA T4",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "metrics": [
                  [{"expression": "SEARCH('{CustomerOps/GPU,InstanceId,index,name,arch} MetricName=\"nvidia_smi_utilization_gpu\"', 'Average', 60)", "label": "GPU utilization (%)", "id": "gpu_util"}],
                  [{"expression": "SEARCH('{CustomerOps/GPU,InstanceId,index,name,arch} MetricName=\"nvidia_smi_utilization_memory\"', 'Average', 60)", "label": "GPU memory utilization (%)", "id": "gpu_mem"}],
                  [{"expression": "SEARCH('{CustomerOps/GPU,InstanceId,index,name,arch} MetricName=\"nvidia_smi_temperature_gpu\"', 'Average', 60)", "label": "GPU temperature (C)", "id": "gpu_temp", "yAxis": "right"}]
                ]
              }
            },
            {
              "type": "alarm",
              "x": 0, "y": 31, "width": 24, "height": 5,
              "properties": {
                "title": "Production alarms",
                "alarms": [
                  "${BackendCanaryErrorAlarm.Arn}",
                  "${BackendApi5xxAlarm.Arn}",
                  "${QualityDlqAlarm.Arn}",
                  "${AnalyticsDlqAlarm.Arn}",
                  "${ApiHealthCanaryAlarm.Arn}"
                ]
              }
            }
          ]
        }

Outputs:
  BackendLambdaFunctionName:
    Value: !Ref BackendFunction
  BackendStableAliasName:
    Value: !Ref BackendStableAlias
  BackendCanaryAliasName:
    Value: !Ref BackendCanaryAlias
  BackendRestApiId:
    Value: !Ref BackendRestApi
  BackendApiStageName:
    Value: !Ref BackendApiStage
  BackendCanaryErrorAlarmName:
    Value: !Ref BackendCanaryErrorAlarm
  BackendApi5xxAlarmName:
    Value: !Ref BackendApi5xxAlarm
  BackendApiUrl:
    Value: !Sub https://${BackendRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}
  ModelApiLoadBalancerUrl:
    Value: !Sub http://${ModelApiLoadBalancer.DNSName}
  ModelApiLoadBalancerDnsName:
    Value: !GetAtt ModelApiLoadBalancer.DNSName
  ModelServerLoadBalancerDnsName:
    Value: !GetAtt ModelServerLoadBalancer.DNSName
  EcsClusterName:
    Value:
      Fn::ImportValue: !Sub customer-ops-${Environment}-cluster
  ModelApiServiceName:
    Value: !GetAtt ModelApiService.Name
  ModelServerServiceName:
    Value: !GetAtt ModelServerService.Name
  ModelApiTaskDefinitionFamily:
    Value: !Sub customer-ops-${Environment}-model-api
  ModelServerTaskDefinitionFamily:
    Value: !Sub customer-ops-${Environment}-model-server
  ModelServerComputeType:
    Value: !Ref ModelServerComputeType
  EventWorkerFunctionName:
    Value: !Ref EventWorkerFunction
  ApiHealthCanaryName:
    Value: !Ref ApiHealthCanary
  OperationsDashboardName:
    Value: !Ref OperationsDashboard
