name: Infrastructure - Update Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Production is the only supported environment
        required: true
        default: production
        type: choice
        options: [production]
      confirmation:
        description: Type UPDATE to update AWS infrastructure
        required: true
        type: string
      model_server_compute:
        description: Model server compute (GPU_EC2 is the production target; FARGATE is rollback)
        required: true
        default: GPU_EC2
        type: choice
        options:
          - GPU_EC2
          - FARGATE

concurrency:
  group: infrastructure-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
  AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::688674375825:role/gh-actions-deploy' }}
  FOUNDATION_STACK: customer-ops-production-foundation
  RUNTIME_STACK: customer-ops-production-runtime

jobs:
  validate:
    name: Validate templates and telemetry services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/performance/cleaner/pnpm-lock.yaml
      - uses: moonrepo/setup-rust@v1
        with:
          channel: 1.94.1
          components: rustfmt, clippy
      - name: Event worker formatting
        working-directory: apps/event-worker
        run: cargo fmt --all -- --check
      - name: Event worker clippy
        working-directory: apps/event-worker
        run: cargo clippy --all-targets -- -D warnings
      - name: Event worker tests
        working-directory: apps/event-worker
        run: cargo test
      - name: Cleaner build and tests
        working-directory: apps/performance/cleaner
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test
      - name: Check production-only template defaults
        run: |
          grep -q 'customer-ops-${Environment}-operations' infra/cloudformation/runtime.yml
          grep -q 'syn-nodejs-puppeteer-17.0' infra/cloudformation/runtime.yml
          grep -q 'FunctionResponseTypes: \[ReportBatchItemFailures\]' infra/cloudformation/runtime.yml
          grep -q 'ECS_ENABLE_GPU_SUPPORT=true' infra/cloudformation/foundation.yml
          grep -q 'Type: GPU' infra/cloudformation/runtime.yml
          grep -q 'GroupDescription: CPU model-server Fargate tasks' infra/cloudformation/foundation.yml
          grep -q 'Service: logs.amazonaws.com' infra/cloudformation/foundation.yml
          performance_bucket="customer-ops-production-perf-123456789012-ap-northeast-1"
          if [ "${#performance_bucket}" -gt 63 ]; then
            echo "::error::Performance detail bucket name exceeds the S3 63-character limit."
            exit 1
          fi

  update:
    name: Update production infrastructure
    if: inputs.confirmation == 'UPDATE'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: moonrepo/setup-rust@v1
        with:
          channel: 1.94.1
          bins: cargo-lambda
      - uses: mlugg/setup-zig@v1
        with:
          version: "0.14.0"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify GPU quota and regional offering
        if: inputs.model_server_compute == 'GPU_EC2'
        run: |
          quota="$(
            aws service-quotas get-service-quota \
              --service-code ec2 \
              --quota-code L-DB2E81BA \
              --query 'Quota.Value' \
              --output text
          )"
          if ! awk -v quota="${quota}" 'BEGIN { exit !(quota >= 4) }'; then
            echo "::error::The regional 'Running On-Demand G and VT instances' quota is ${quota} vCPU; g4dn.xlarge requires at least 4. Request a quota increase before this workflow."
            exit 1
          fi
          offerings="$(
            aws ec2 describe-instance-type-offerings \
              --location-type availability-zone \
              --filters Name=instance-type,Values=g4dn.xlarge \
              --query 'InstanceTypeOfferings[].Location' \
              --output text
          )"
          if [ -z "${offerings}" ] || [ "${offerings}" = "None" ]; then
            echo "::error::g4dn.xlarge is not offered in any Availability Zone in ${AWS_REGION}."
            exit 1
          fi
          echo "GPU quota: ${quota} vCPU; offerings: ${offerings}"

      - name: Require existing production stacks
        run: |
          aws cloudformation describe-stacks --stack-name "${FOUNDATION_STACK}" >/dev/null
          aws cloudformation describe-stacks --stack-name "${RUNTIME_STACK}" >/dev/null

      - name: Validate CloudFormation
        run: |
          aws cloudformation validate-template \
            --template-body file://infra/cloudformation/foundation.yml >/dev/null
          aws cloudformation validate-template \
            --template-body file://infra/cloudformation/runtime.yml >/dev/null

      - name: Read current application artifacts
        run: |
          parameter() {
            aws cloudformation describe-stacks \
              --stack-name "${RUNTIME_STACK}" \
              --query "Stacks[0].Parameters[?ParameterKey=='$1'].ParameterValue" \
              --output text
          }
          output() {
            local stack_name="$1"
            local output_key="$2"
            aws cloudformation describe-stacks \
              --stack-name "${stack_name}" \
              --query "Stacks[0].Outputs[?OutputKey=='${output_key}'].OutputValue" \
              --output text
          }
          active_service_task_definition() {
            local service_name="$1"
            local cluster_name="$2"
            aws ecs describe-services \
              --cluster "${cluster_name}" \
              --services "${service_name}" \
              --query 'services[0].taskDefinition' \
              --output text
          }
          task_definition_image() {
            local task_definition="$1"
            local container_name="$2"
            aws ecs describe-task-definition \
              --task-definition "${task_definition}" \
              --query "taskDefinition.containerDefinitions[?name=='${container_name}'].image | [0]" \
              --output text
          }
          artifact_bucket="$(
            output "${FOUNDATION_STACK}" DeploymentBucketName
          )"
          ecs_cluster="$(output "${RUNTIME_STACK}" EcsClusterName)"
          model_api_service="$(output "${RUNTIME_STACK}" ModelApiServiceName)"
          model_server_service="$(output "${RUNTIME_STACK}" ModelServerServiceName)"
          model_api_task_definition="$(active_service_task_definition "${model_api_service}" "${ecs_cluster}")"
          model_server_task_definition="$(active_service_task_definition "${model_server_service}" "${ecs_cluster}")"
          model_api_image="$(task_definition_image "${model_api_task_definition}" model-api)"
          model_server_image="$(task_definition_image "${model_server_task_definition}" model-server)"
          model_server_gpu_layers="$(
            aws ecs describe-task-definition \
              --task-definition "${model_server_task_definition}" \
              --query "taskDefinition.containerDefinitions[?name=='model-server'].environment[?name=='MODEL_GPU_LAYERS'].value | [0][0]" \
              --output text
          )"
          for value in "${artifact_bucket}" "${ecs_cluster}" "${model_api_image}" "${model_server_image}"; do
            if [ -z "${value}" ] || [ "${value}" = "None" ]; then
              echo "::error::Could not resolve the active production artifacts."
              exit 1
            fi
          done
          if [ -z "${model_server_gpu_layers}" ] || [ "${model_server_gpu_layers}" = "None" ]; then
            if [ "${{ inputs.model_server_compute }}" = "GPU_EC2" ]; then
              model_server_gpu_layers="-1"
            else
              model_server_gpu_layers="0"
            fi
            echo "::notice::The active task definition does not set MODEL_GPU_LAYERS; using ${model_server_gpu_layers} for ${{ inputs.model_server_compute }}."
          fi
          if [ "${model_server_gpu_layers}" != "-1" ] && [ "${model_server_gpu_layers}" != "0" ]; then
            echo "::error::Unexpected MODEL_GPU_LAYERS value: ${model_server_gpu_layers}"
            exit 1
          fi
          {
            echo "ARTIFACT_BUCKET=${artifact_bucket}"
            echo "BACKEND_CODE_BUCKET=$(parameter BackendLambdaCodeBucket)"
            echo "BACKEND_CODE_KEY=$(parameter BackendLambdaCodeKey)"
            echo "MODEL_API_IMAGE=${model_api_image}"
            echo "MODEL_SERVER_IMAGE=${model_server_image}"
            echo "MODEL_SERVER_GPU_LAYERS=${model_server_gpu_layers}"
            echo "MODEL_BUCKET=$(parameter ModelBucketName)"
            echo "MODEL_OBJECT_KEY=$(parameter ModelObjectKey)"
            echo "EMBEDDING_PREFIX=$(parameter EmbeddingModelPrefix)"
            echo "RERANK_PREFIX=$(parameter RerankModelPrefix)"
            echo "MODEL_SHA256=$(parameter ModelSha256)"
          } >> "${GITHUB_ENV}"

      - name: Build and upload event worker
        working-directory: apps/event-worker
        run: |
          cargo lambda build --release --output-format zip --bin event-worker
          key="lambda/production/event-worker/${GITHUB_SHA}/bootstrap.zip"
          aws s3 cp \
            target/lambda/event-worker/bootstrap.zip \
            "s3://${ARTIFACT_BUCKET}/${key}" \
            --only-show-errors
          echo "EVENT_WORKER_CODE_KEY=${key}" >> "${GITHUB_ENV}"

      - name: Update foundation without replacing secrets
        run: |
          if ! aws cloudformation deploy \
              --stack-name "${FOUNDATION_STACK}" \
              --template-file infra/cloudformation/foundation.yml \
              --capabilities CAPABILITY_NAMED_IAM \
              --no-fail-on-empty-changeset \
              --parameter-overrides Environment=production; then
            aws cloudformation describe-stack-events \
              --stack-name "${FOUNDATION_STACK}" \
              --max-items 40 \
              --query "StackEvents[?ResourceStatusReason != null].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
              --output table
            exit 1
          fi

      - name: Build and publish performance cleaner
        run: |
          repository="$(
            aws cloudformation describe-stacks \
              --stack-name "${FOUNDATION_STACK}" \
              --query "Stacks[0].Outputs[?OutputKey=='PerformanceCleanerRepositoryName'].OutputValue" \
              --output text
          )"
          registry="${AWS_ACCOUNT_ID:-$(
            aws sts get-caller-identity --query Account --output text
          )}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password |
            docker login --username AWS --password-stdin "${registry}"
          docker build \
            --tag "${registry}/${repository}:${GITHUB_SHA}" \
            apps/performance/cleaner
          docker push "${registry}/${repository}:${GITHUB_SHA}"
          echo "PERFORMANCE_CLEANER_IMAGE=${registry}/${repository}:${GITHUB_SHA}" >> "${GITHUB_ENV}"

      - name: Update runtime while preserving application artifacts
        run: |
          if ! aws cloudformation deploy \
              --stack-name "${RUNTIME_STACK}" \
              --template-file infra/cloudformation/runtime.yml \
              --capabilities CAPABILITY_NAMED_IAM \
              --no-fail-on-empty-changeset \
              --parameter-overrides \
                Environment=production \
                BackendLambdaCodeBucket="${BACKEND_CODE_BUCKET}" \
                BackendLambdaCodeKey="${BACKEND_CODE_KEY}" \
                EventWorkerLambdaCodeKey="${EVENT_WORKER_CODE_KEY}" \
                ModelApiImageUri="${MODEL_API_IMAGE}" \
                ModelServerImageUri="${MODEL_SERVER_IMAGE}" \
                PerformanceCleanerImageUri="${PERFORMANCE_CLEANER_IMAGE}" \
                ModelBucketName="${MODEL_BUCKET}" \
                ModelObjectKey="${MODEL_OBJECT_KEY}" \
                EmbeddingModelPrefix="${EMBEDDING_PREFIX}" \
                RerankModelPrefix="${RERANK_PREFIX}" \
                ModelSha256="${MODEL_SHA256}" \
                ModelServerComputeType="${{ inputs.model_server_compute }}" \
                ModelServerGpuLayers="${MODEL_SERVER_GPU_LAYERS}" \
                BackendCanaryPercent=0; then
            aws cloudformation describe-stack-events \
              --stack-name "${RUNTIME_STACK}" \
              --max-items 40 \
              --query "StackEvents[?ResourceStatusReason != null].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
              --output table
            exit 1
          fi

      - name: Verify infrastructure outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "${RUNTIME_STACK}" \
            --query "Stacks[0].Outputs[?OutputKey=='OperationsDashboardName'||OutputKey=='ApiHealthCanaryName'||OutputKey=='EventWorkerFunctionName'].[OutputKey,OutputValue]" \
            --output table

      - name: Summary
        run: |
          {
            echo "### Production infrastructure updated"
            echo
            echo "- Existing backend artifact preserved: \`${BACKEND_CODE_KEY}\`"
            echo "- Existing model-api image preserved: \`${MODEL_API_IMAGE}\`"
            echo "- Existing model-server image preserved: \`${MODEL_SERVER_IMAGE}\`"
            echo "- Model-server compute: \`${{ inputs.model_server_compute }}\`"
            echo "- Model-server GPU layers preserved: \`${MODEL_SERVER_GPU_LAYERS}\`"
            echo "- API Gateway canary traffic forced to \`0%\`"
            echo "- No frontend deployment was performed"
          } >> "${GITHUB_STEP_SUMMARY}"
