name: Python Model Server - Amazon ECS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment containing the AWS deployment configuration
        required: true
        default: production
        type: choice
        options:
          - production
      image_variant:
        description: GPU for normal production; CPU only as the first step of a Fargate rollback
        required: true
        default: gpu
        type: choice
        options:
          - gpu
          - cpu

concurrency:
  group: model-server-production
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/model-server

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.22"
          enable-cache: true
          cache-dependency-glob: apps/model-server/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Test
        run: uv run pytest

  deploy:
    name: Deploy production
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::688674375825:role/gh-actions-deploy' }}
      FOUNDATION_STACK: customer-ops-production-foundation
      RUNTIME_STACK: customer-ops-production-runtime
      MODEL_BUCKET_NAME: ${{ vars.MODEL_BUCKET_NAME || 'customer-ops-models' }}
      EMBEDDING_MODEL_PREFIX: ${{ vars.EMBEDDING_MODEL_PREFIX || 'models/customer-ops/bge-m3-onnx/' }}
      RERANK_MODEL_PREFIX: ${{ vars.RERANK_MODEL_PREFIX || 'models/customer-ops/bge-reranker-v2-m3-onnx/' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        run: |
          : "${AWS_REGION:?Configure AWS_REGION in the GitHub Environment}"
          : "${AWS_DEPLOY_ROLE_ARN:?Configure AWS_DEPLOY_ROLE_ARN in the GitHub Environment}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Discover deployment resources
        id: resources
        run: |
          for stack in "${FOUNDATION_STACK}" "${RUNTIME_STACK}"; do
            status="$(
              aws cloudformation describe-stacks \
                --stack-name "${stack}" \
                --query 'Stacks[0].StackStatus' \
                --output text
            )"
            case "${status}" in
              CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE)
                echo "${stack}: ${status}"
                ;;
              *)
                echo "::error::Stack ${stack} is not stable (${status}). Finish or cancel the infrastructure update before publishing a model image."
                exit 1
                ;;
            esac
          done

          stack_output() {
            local stack_name="$1"
            local output_key="$2"
            local value
            if ! value="$(
              aws cloudformation describe-stacks \
                --stack-name "${stack_name}" \
                --query "Stacks[0].Outputs[?OutputKey=='${output_key}'].OutputValue" \
                --output text 2>/dev/null
            )"; then
              echo "::error::Platform stack ${stack_name} is missing. Run 'Infrastructure - Provision Platform' first." >&2
              return 1
            fi
            if [ -z "${value}" ] || [ "${value}" = "None" ]; then
              echo "::error::CloudFormation output ${output_key} is missing from ${stack_name}." >&2
              return 1
            fi
            printf '%s' "${value}"
          }
          ecr_repository="$(stack_output "${FOUNDATION_STACK}" ModelServerRepositoryName)"
          ecs_cluster="$(stack_output "${RUNTIME_STACK}" EcsClusterName)"
          ecs_service="$(stack_output "${RUNTIME_STACK}" ModelServerServiceName)"
          task_family="$(stack_output "${RUNTIME_STACK}" ModelServerTaskDefinitionFamily)"
          compute_type="$(stack_output "${RUNTIME_STACK}" ModelServerComputeType)"
          if [ "${{ inputs.image_variant }}" = "gpu" ] && [ "${compute_type}" != "GPU_EC2" ]; then
            echo "::error::GPU image deployment requires ModelServerComputeType=GPU_EC2. Run Infrastructure - Update Production first."
            exit 1
          fi
          {
            echo "ecr_repository=${ecr_repository}"
            echo "ecs_cluster=${ecs_cluster}"
            echo "ecs_service=${ecs_service}"
            echo "task_family=${task_family}"
            echo "compute_type=${compute_type}"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify retrieval artifacts and active task configuration
        run: |
          for prefix in "${EMBEDDING_MODEL_PREFIX}" "${RERANK_MODEL_PREFIX}"; do
            for artifact in SHA256SUMS model.onnx model.onnx_data tokenizer.json; do
              aws s3api head-object \
                --bucket "${MODEL_BUCKET_NAME}" \
                --key "${prefix}${artifact}" \
                >/dev/null
            done
          done

          aws ecs describe-task-definition \
            --task-definition "${{ steps.resources.outputs.task_family }}" \
            --query taskDefinition \
            > "${RUNNER_TEMP}/model-server-task-definition.json"

          embedding_uri="s3://${MODEL_BUCKET_NAME}/${EMBEDDING_MODEL_PREFIX}"
          rerank_uri="s3://${MODEL_BUCKET_NAME}/${RERANK_MODEL_PREFIX}"
          jq -e \
            --arg embedding_uri "${embedding_uri}" \
            --arg rerank_uri "${rerank_uri}" \
            '
              .containerDefinitions[]
              | select(.name == "model-server")
              | (.environment // []) as $environment
              | any($environment[]; .name == "EMBEDDING_MODEL_S3_URI" and .value == $embedding_uri)
                and any($environment[]; .name == "RERANK_MODEL_S3_URI" and .value == $rerank_uri)
                and any($environment[]; .name == "EMBEDDING_MODEL_PATH" and .value == "/models/bge-m3-onnx/model.onnx")
                and any($environment[]; .name == "RERANK_MODEL_PATH" and .value == "/models/bge-reranker-v2-m3-onnx/model.onnx")
            ' "${RUNNER_TEMP}/model-server-task-definition.json" >/dev/null || {
              echo "::error::Active task definition is missing the RAG model configuration. Run 'Infrastructure - Provision Platform' for this environment, then rerun this workflow."
              exit 1
            }

      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable inference image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/model-server/Dockerfile
          target: ${{ inputs.image_variant }}-runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ steps.resources.outputs.ecr_repository }}:${{ github.sha }}-${{ inputs.image_variant }}
          cache-from: type=gha,scope=model-server-${{ inputs.image_variant }}
          cache-to: type=gha,mode=max,scope=model-server-${{ inputs.image_variant }}

      - name: Smoke test packaged Python runtime
        run: |
          image="${{ steps.ecr.outputs.registry }}/${{ steps.resources.outputs.ecr_repository }}:${GITHUB_SHA}-${{ inputs.image_variant }}"
          docker pull "${image}"
          docker run --rm \
            --entrypoint python3 \
            "${image}" \
            -c 'import fastapi, numpy, onnxruntime, tokenizers, uvicorn'

      - name: Refresh AWS credentials before ECS deployment
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Render image into task definition
        id: task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ runner.temp }}/model-server-task-definition.json
          container-name: model-server
          image: ${{ steps.ecr.outputs.registry }}/${{ steps.resources.outputs.ecr_repository }}:${{ github.sha }}-${{ inputs.image_variant }}
          environment-variables: |
            MODEL_GPU_LAYERS=${{ inputs.image_variant == 'gpu' && '-1' || '0' }}

      - name: Deploy task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task.outputs.task-definition }}
          cluster: ${{ steps.resources.outputs.ecs_cluster }}
          service: ${{ steps.resources.outputs.ecs_service }}
          wait-for-service-stability: true
          wait-max-delay-seconds: 15

      - name: Deployment summary
        run: |
          {
            echo "### Python model-server"
            echo
            echo "- Cluster/service: \`${{ steps.resources.outputs.ecs_cluster }}/${{ steps.resources.outputs.ecs_service }}\`"
            echo "- Image: \`${{ steps.resources.outputs.ecr_repository }}:${GITHUB_SHA}-${{ inputs.image_variant }}\`"
            echo "- Variant: \`${{ inputs.image_variant }}\`"
            echo "- Compute: \`${{ steps.resources.outputs.compute_type }}\`"
            echo "- Exposure: private; ingress on port 8000 only from the Mastra task security group"
            echo "- Models: GGUF, BGE-M3 and BGE Reranker downloaded from S3 at startup"
            echo "- GPU variant: CUDA 12.6 / compute capability 7.5; CPU variant is reserved for Fargate rollback"
            echo "- Capacity is controlled by the runtime stack: g4dn.xlarge GPU or Fargate fallback"
          } >> "${GITHUB_STEP_SUMMARY}"
