name: Python Model Server - Amazon ECS

on:
  pull_request:
    paths:
      - "apps/model-server/**"
      - ".github/workflows/model-server-ecs.yml"
  push:
    branches:
      - main
    paths:
      - "apps/model-server/**"
      - ".github/workflows/model-server-ecs.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment containing the AWS deployment configuration
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: model-server-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/model-server

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.22"
          enable-cache: true
          cache-dependency-glob: apps/model-server/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Test
        run: uv run pytest

  deploy:
    name: Deploy ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::688674375825:role/gh-actions-deploy' }}
      FOUNDATION_STACK: customer-ops-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}-foundation
      RUNTIME_STACK: customer-ops-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        run: |
          : "${AWS_REGION:?Configure AWS_REGION in the GitHub Environment}"
          : "${AWS_DEPLOY_ROLE_ARN:?Configure AWS_DEPLOY_ROLE_ARN in the GitHub Environment}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Discover deployment resources
        id: resources
        run: |
          stack_output() {
            local stack_name="$1"
            local output_key="$2"
            local value
            if ! value="$(
              aws cloudformation describe-stacks \
                --stack-name "${stack_name}" \
                --query "Stacks[0].Outputs[?OutputKey=='${output_key}'].OutputValue" \
                --output text 2>/dev/null
            )"; then
              echo "::error::Platform stack ${stack_name} is missing. Run 'Infrastructure - Provision Platform' first." >&2
              return 1
            fi
            if [ -z "${value}" ] || [ "${value}" = "None" ]; then
              echo "::error::CloudFormation output ${output_key} is missing from ${stack_name}." >&2
              return 1
            fi
            printf '%s' "${value}"
          }
          ecr_repository="$(stack_output "${FOUNDATION_STACK}" ModelServerRepositoryName)"
          ecs_cluster="$(stack_output "${RUNTIME_STACK}" EcsClusterName)"
          ecs_service="$(stack_output "${RUNTIME_STACK}" ModelServerServiceName)"
          task_family="$(stack_output "${RUNTIME_STACK}" ModelServerTaskDefinitionFamily)"
          {
            echo "ecr_repository=${ecr_repository}"
            echo "ecs_cluster=${ecs_cluster}"
            echo "ecs_service=${ecs_service}"
            echo "task_family=${task_family}"
          } >> "${GITHUB_OUTPUT}"

      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable CPU image
        uses: docker/build-push-action@v6
        with:
          context: apps/model-server
          file: apps/model-server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ steps.resources.outputs.ecr_repository }}:${{ github.sha }}
          cache-from: type=gha,scope=model-server
          cache-to: type=gha,mode=max,scope=model-server

      - name: Download active task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ steps.resources.outputs.task_family }}" \
            --query taskDefinition \
            > "${RUNNER_TEMP}/model-server-task-definition.json"

      - name: Render image into task definition
        id: task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ runner.temp }}/model-server-task-definition.json
          container-name: model-server
          image: ${{ steps.ecr.outputs.registry }}/${{ steps.resources.outputs.ecr_repository }}:${{ github.sha }}

      - name: Deploy task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task.outputs.task-definition }}
          cluster: ${{ steps.resources.outputs.ecs_cluster }}
          service: ${{ steps.resources.outputs.ecs_service }}
          wait-for-service-stability: true

      - name: Deployment summary
        run: |
          {
            echo "### Python model-server"
            echo
            echo "- Cluster/service: \`${{ steps.resources.outputs.ecs_cluster }}/${{ steps.resources.outputs.ecs_service }}\`"
            echo "- Image: \`${{ steps.resources.outputs.ecr_repository }}:${GITHUB_SHA}\`"
            echo "- Exposure: private; ingress on port 8000 only from the Mastra task security group"
            echo "- Model: downloaded at runtime from the task definition's \`MODEL_S3_URI\`"
          } >> "${GITHUB_STEP_SUMMARY}"
