name: Frontend - Cloudflare Workers

on:
  pull_request:
    paths:
      - "apps/frontend/**"
      - ".github/workflows/frontend-cloudflare.yml"
  push:
    branches:
      - main
    paths:
      - "apps/frontend/**"
      - ".github/workflows/frontend-cloudflare.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment and Wrangler environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: frontend-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/frontend

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Validate Worker bundle
        run: pnpm check:worker

  deploy:
    name: Deploy ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
    env:
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_CHAT_API_BASE_URL: ${{ vars.VITE_CHAT_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate deployment configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SSR_API_BASE_URL: ${{ vars.SSR_API_BASE_URL }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Configure CLOUDFLARE_ACCOUNT_ID in the GitHub Environment}"
          : "${CLOUDFLARE_API_TOKEN:?Configure CLOUDFLARE_API_TOKEN in the GitHub Environment}"
          : "${SSR_API_BASE_URL:?Configure SSR_API_BASE_URL in the GitHub Environment}"
          : "${VITE_API_BASE_URL:?Configure VITE_API_BASE_URL in the GitHub Environment}"
          : "${VITE_CHAT_API_BASE_URL:?Configure VITE_CHAT_API_BASE_URL in the GitHub Environment}"

      - name: Build Worker
        run: pnpm build:worker

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/frontend
          command: deploy --env ${{ env.DEPLOY_ENV }} --var SSR_API_BASE_URL:${{ vars.SSR_API_BASE_URL }}
