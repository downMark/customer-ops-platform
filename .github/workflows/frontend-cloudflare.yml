name: Frontend - Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment and Wrangler environment
        required: true
        default: production
        type: choice
        options:
          - production

concurrency:
  group: frontend-production
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/frontend

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Validate Worker bundle
        run: pnpm check:worker

  deploy:
    name: Deploy production
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENV: production
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::688674375825:role/gh-actions-deploy' }}
      RUNTIME_STACK: customer-ops-production-runtime
      VITE_CHAT_API_BASE_URL: /model-api
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate deployment configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Configure CLOUDFLARE_ACCOUNT_ID in the GitHub Environment}"
          : "${CLOUDFLARE_API_TOKEN:?Configure CLOUDFLARE_API_TOKEN in the GitHub Environment}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Discover platform endpoints
        id: resources
        run: |
          read_output() {
            local output_key="$1"
            local value
            if ! value="$(
              aws cloudformation describe-stacks \
                --stack-name "${RUNTIME_STACK}" \
                --query "Stacks[0].Outputs[?OutputKey=='${output_key}'].OutputValue" \
                --output text 2>/dev/null
            )"; then
              echo "::error::Platform stack ${RUNTIME_STACK} is missing. Run 'Infrastructure - Provision Platform' first." >&2
              return 1
            fi
            if [ -z "${value}" ] || [ "${value}" = "None" ]; then
              echo "::error::CloudFormation output ${output_key} is missing from ${RUNTIME_STACK}." >&2
              return 1
            fi
            printf '%s' "${value}"
          }
          backend_url="$(read_output BackendApiUrl)"
          model_api_url="$(read_output ModelApiLoadBalancerUrl)"
          {
            echo "backend_url=${backend_url}"
            echo "model_api_url=${model_api_url}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build Worker
        env:
          VITE_API_BASE_URL: /backend-api
          VITE_CHAT_API_BASE_URL: /model-api
        run: pnpm build:worker

      - name: Deploy Worker
        id: cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/frontend
          command: >-
            deploy --env ${{ env.DEPLOY_ENV }}
            --var SSR_API_BASE_URL:${{ steps.resources.outputs.backend_url }}
            --var MODEL_API_BASE_URL:${{ steps.resources.outputs.model_api_url }}

      - name: Deployment summary
        run: |
          {
            echo "### Frontend Worker"
            echo
            echo "- Environment: \`${DEPLOY_ENV}\`"
            echo "- Frontend URL: \`${{ steps.cloudflare.outputs.deployment-url }}\`"
            echo "- Backend and model APIs are accessed through same-origin Worker proxies"
          } >> "${GITHUB_STEP_SUMMARY}"
