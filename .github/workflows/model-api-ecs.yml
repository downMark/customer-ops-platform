name: Model API - Amazon ECS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment containing the AWS deployment configuration
        required: true
        default: production
        type: choice
        options:
          - production

concurrency:
  group: model-api-production
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/model-api

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/model-api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        env:
          MASTRA_TELEMETRY_DISABLED: "1"
        run: pnpm build

  deploy:
    name: Deploy production
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::688674375825:role/gh-actions-deploy' }}
      FOUNDATION_STACK: customer-ops-production-foundation
      RUNTIME_STACK: customer-ops-production-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        run: |
          : "${AWS_REGION:?Configure AWS_REGION in the GitHub Environment}"
          : "${AWS_DEPLOY_ROLE_ARN:?Configure AWS_DEPLOY_ROLE_ARN in the GitHub Environment}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Discover deployment resources
        id: resources
        run: |
          stack_output() {
            local stack_name="$1"
            local output_key="$2"
            local value
            if ! value="$(
              aws cloudformation describe-stacks \
                --stack-name "${stack_name}" \
                --query "Stacks[0].Outputs[?OutputKey=='${output_key}'].OutputValue" \
                --output text 2>/dev/null
            )"; then
              echo "::error::Platform stack ${stack_name} is missing. Run 'Infrastructure - Provision Platform' first." >&2
              return 1
            fi
            if [ -z "${value}" ] || [ "${value}" = "None" ]; then
              echo "::error::CloudFormation output ${output_key} is missing from ${stack_name}." >&2
              return 1
            fi
            printf '%s' "${value}"
          }
          ecr_repository="$(stack_output "${FOUNDATION_STACK}" ModelApiRepositoryName)"
          ecs_cluster="$(stack_output "${RUNTIME_STACK}" EcsClusterName)"
          ecs_service="$(stack_output "${RUNTIME_STACK}" ModelApiServiceName)"
          task_family="$(stack_output "${RUNTIME_STACK}" ModelApiTaskDefinitionFamily)"
          {
            echo "ecr_repository=${ecr_repository}"
            echo "ecs_cluster=${ecs_cluster}"
            echo "ecs_service=${ecs_service}"
            echo "task_family=${task_family}"
          } >> "${GITHUB_OUTPUT}"

      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: apps/model-api
          file: apps/model-api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ steps.resources.outputs.ecr_repository }}:${{ github.sha }}
          cache-from: type=gha,scope=model-api
          cache-to: type=gha,mode=max,scope=model-api

      - name: Download active task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ steps.resources.outputs.task_family }}" \
            --query taskDefinition \
            > "${RUNNER_TEMP}/model-api-task-definition.json"

      - name: Render image into task definition
        id: task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ runner.temp }}/model-api-task-definition.json
          container-name: model-api
          image: ${{ steps.ecr.outputs.registry }}/${{ steps.resources.outputs.ecr_repository }}:${{ github.sha }}

      - name: Deploy task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task.outputs.task-definition }}
          cluster: ${{ steps.resources.outputs.ecs_cluster }}
          service: ${{ steps.resources.outputs.ecs_service }}
          wait-for-service-stability: true

      - name: Deployment summary
        run: |
          {
            echo "### Mastra model-api"
            echo
            echo "- Cluster/service: \`${{ steps.resources.outputs.ecs_cluster }}/${{ steps.resources.outputs.ecs_service }}\`"
            echo "- Image: \`${{ steps.resources.outputs.ecr_repository }}:${GITHUB_SHA}\`"
            echo "- Exposure: public HTTPS ALB; CORS restricted by \`CORS_ORIGINS\`"
          } >> "${GITHUB_STEP_SUMMARY}"
