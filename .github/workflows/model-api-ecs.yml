name: Model API - Amazon ECS

on:
  pull_request:
    paths:
      - "apps/model-api/**"
      - ".github/workflows/model-api-ecs.yml"
  push:
    branches:
      - main
    paths:
      - "apps/model-api/**"
      - ".github/workflows/model-api-ecs.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment containing the AWS deployment configuration
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: model-api-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/model-api

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/model-api/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        env:
          MASTRA_TELEMETRY_DISABLED: "1"
        run: pnpm build

  deploy:
    name: Deploy ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::688674375825:role/gh-actions-deploy' }}
      FOUNDATION_STACK: customer-ops-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}-foundation
      RUNTIME_STACK: customer-ops-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        run: |
          : "${AWS_REGION:?Configure AWS_REGION in the GitHub Environment}"
          : "${AWS_DEPLOY_ROLE_ARN:?Configure AWS_DEPLOY_ROLE_ARN in the GitHub Environment}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Discover deployment resources
        id: resources
        run: |
          foundation_output() {
            aws cloudformation describe-stacks \
              --stack-name "${FOUNDATION_STACK}" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }
          runtime_output() {
            aws cloudformation describe-stacks \
              --stack-name "${RUNTIME_STACK}" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }
          {
            echo "ecr_repository=$(foundation_output ModelApiRepositoryName)"
            echo "ecs_cluster=$(runtime_output EcsClusterName)"
            echo "ecs_service=$(runtime_output ModelApiServiceName)"
            echo "task_family=$(runtime_output ModelApiTaskDefinitionFamily)"
          } >> "${GITHUB_OUTPUT}"

      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: apps/model-api
          file: apps/model-api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ steps.resources.outputs.ecr_repository }}:${{ github.sha }}
          cache-from: type=gha,scope=model-api
          cache-to: type=gha,mode=max,scope=model-api

      - name: Download active task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ steps.resources.outputs.task_family }}" \
            --query taskDefinition \
            > "${RUNNER_TEMP}/model-api-task-definition.json"

      - name: Render image into task definition
        id: task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ runner.temp }}/model-api-task-definition.json
          container-name: model-api
          image: ${{ steps.ecr.outputs.registry }}/${{ steps.resources.outputs.ecr_repository }}:${{ github.sha }}

      - name: Deploy task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task.outputs.task-definition }}
          cluster: ${{ steps.resources.outputs.ecs_cluster }}
          service: ${{ steps.resources.outputs.ecs_service }}
          wait-for-service-stability: true

      - name: Deployment summary
        run: |
          {
            echo "### Mastra model-api"
            echo
            echo "- Cluster/service: \`${{ steps.resources.outputs.ecs_cluster }}/${{ steps.resources.outputs.ecs_service }}\`"
            echo "- Image: \`${{ steps.resources.outputs.ecr_repository }}:${GITHUB_SHA}\`"
            echo "- Exposure: public HTTPS ALB; CORS restricted by \`CORS_ORIGINS\`"
          } >> "${GITHUB_STEP_SUMMARY}"
