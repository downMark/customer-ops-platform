name: Backend - AWS Lambda

on:
  pull_request:
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-lambda.yml"
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-lambda.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment containing the AWS deployment configuration
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: backend-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/backend

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: moonrepo/setup-rust@v1
        with:
          channel: 1.94.1
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --features lambda,sns -- -D warnings

      - name: Test
        run: cargo test --features lambda

  deploy:
    name: Deploy ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      BACKEND_LAMBDA_FUNCTION_NAME: ${{ vars.BACKEND_LAMBDA_FUNCTION_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust and Cargo Lambda
        uses: moonrepo/setup-rust@v1
        with:
          channel: 1.94.1
          bins: cargo-lambda

      - name: Set up Zig
        uses: mlugg/setup-zig@v1
        with:
          version: "0.14.0"

      - name: Validate deployment configuration
        run: |
          : "${AWS_REGION:?Configure AWS_REGION in the GitHub Environment}"
          : "${AWS_DEPLOY_ROLE_ARN:?Configure AWS_DEPLOY_ROLE_ARN in the GitHub Environment}"
          : "${BACKEND_LAMBDA_FUNCTION_NAME:?Configure BACKEND_LAMBDA_FUNCTION_NAME in the GitHub Environment}"

      - name: Build Lambda package
        run: cargo lambda build --release --output-format zip --bin lambda --features lambda,sns

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish Lambda code
        id: publish
        run: |
          version="$(
            aws lambda update-function-code \
              --function-name "${BACKEND_LAMBDA_FUNCTION_NAME}" \
              --zip-file "fileb://target/lambda/lambda/bootstrap.zip" \
              --publish \
              --query Version \
              --output text
          )"
          aws lambda wait function-updated-v2 \
            --function-name "${BACKEND_LAMBDA_FUNCTION_NAME}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Deployment summary
        run: |
          {
            echo "### Backend Lambda"
            echo
            echo "- Environment: \`${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}\`"
            echo "- Function: \`${BACKEND_LAMBDA_FUNCTION_NAME}\`"
            echo "- Published version: \`${{ steps.publish.outputs.version }}\`"
            echo "- Region: \`${AWS_REGION}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
