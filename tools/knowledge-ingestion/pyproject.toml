[project]
name = "customer-ops-knowledge-ingestion"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
