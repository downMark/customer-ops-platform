[package]
name = "customer-ops-backend"
version = "0.1.0"
edition = "2021"
default-run = "backend"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "timeout", "cors"] }
sea-orm = { version = "1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
] }
sea-orm-migration = { version = "1", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
argon2 = "0.5"
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
customer-ops-performance = { path = "../performance/sdk/rust" }
lambda_http = { version = "1.2", optional = true }
# AWS SDK 仅在启用 `sns` feature 时编译（其最新版要求 rustc ≥ 1.94.1）。
# 本地默认用 NoopPublisher，无需 AWS 依赖；部署环境用 `--features sns` 打开真实 SNS。
aws-config = { version = "1", features = [
    "behavior-version-latest",
], optional = true }
aws-sdk-sns = { version = "1", optional = true }
aws-sdk-sqs = { version = "1", optional = true }
aws-sdk-dynamodb = { version = "1", optional = true }
aws-sdk-cloudwatch = { version = "1", optional = true }
aws-smithy-types = { version = "1", optional = true }

[features]
default = []
sns = ["dep:aws-config", "dep:aws-sdk-sns"]
ops = [
    "dep:aws-config",
    "dep:aws-sdk-sns",
    "dep:aws-sdk-sqs",
    "dep:aws-sdk-dynamodb",
    "dep:aws-sdk-cloudwatch",
    "dep:aws-smithy-types",
]
lambda = ["dep:lambda_http"]

[[bin]]
name = "backend"
path = "src/main.rs"

[[bin]]
name = "lambda"
path = "src/bin/lambda.rs"
required-features = ["lambda"]

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

# 项目位于外接磁盘；该文件系统不支持 Cargo 增量缓存依赖的硬链接。
# 关闭本地开发/测试增量编译，避免 cached cgu 缺少 object file。
[profile.dev]
incremental = false

[profile.test]
incremental = false
